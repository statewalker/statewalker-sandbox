# PeerShare's own pieces: the page and its session zone, behind Caddy.
#
# The relay is httpeers' (relay.httpeers.net, already deployed with the limits
# PeerShare needs: 1 GiB / 6 h per relayed connection). `--profile relay` runs
# one here instead.

name: peershare

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      PAGE_HOST: ${PAGE_HOST:?set PAGE_HOST, e.g. tools.sandclaw.ai}
      SESSION_ZONE: ${SESSION_ZONE:?set SESSION_ZONE, e.g. p.sandclaw.ai}
      TLS: ${TLS:?set TLS (an ACME email, or "<cert> <key>" files under /certs)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./srv:/srv:ro
      - ${CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data

  relay:
    profiles: ["relay"]
    image: ${RELAY_IMAGE:-ghcr.io/statewalker/httpeers-relay:latest}
    restart: unless-stopped
    environment:
      RELAY_PORT: "9090"
      RELAY_KEY_PATH: /data/.httpeers/relay.key
    volumes:
      - relay_key:/data/.httpeers

volumes:
  caddy_data:
  relay_key:
