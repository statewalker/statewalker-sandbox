catalogs:
  # TypeScript 7's npm package has no stable compiler API (its root exports only the version;
  # the parser is under typescript/unstable/*). httpeers-shell-protos parses source with it at
  # runtime (04-manifest-generation, Z-static-schema), so it stays on the 6.x API.
  ts-api:
    typescript: ^6.0.3
