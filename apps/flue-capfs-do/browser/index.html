<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flue-capfs-do in the browser</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 900px; }
      textarea { width: 100%; height: 12em; font: 13px ui-monospace, monospace; }

  <body>
    <h1>flue-capfs-do on cellb (browser)</h1>
    <p>Cells: <span id="status">loading…</span>. Python runs in its own Worker; files come from the
      Workspace Durable Object through alice's capability (rights: <code>/proj</code>).</p>
    <textarea id="code">import os, csv
print(os.listdir("/workspace"))
rows = list(csv.reader(open("/workspace/proj/data.csv")))
print(rows)
with open("/workspace/proj/sum.txt", "w") as f:
    f.write(str(sum(int(r[0]) for r in rows[1:])))
os.makedirs("/workspace/hr", exist_ok=True)
open("/workspace/hr/stolen.txt", "w").write("x")  # outside the rights: refused on write-back</textarea>
    <p><button id="run" type="button">Run Python</button></p>
    <pre id="out"></pre>
    <script type="module" src="/page.js"></script>
  </body>
</html>
