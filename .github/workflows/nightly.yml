name: Nightly

# The slow suites the CI of a pull request does not run (statewalker/statewalker-ci's
# nightly.yml): root `test:nightly` runs the browser suites (`test:browser` of mvc-blueprint-00…03,
# vcs-protos and fm-protos, each to the end even when one fails) and tesseract-do's
# end-to-end runs on wrangler and cellb (`test:e2e`, after `fixtures` downloads its test images
# and models). A failure opens one `bug` + `ci-baseline` issue here; later failures comment on it
# while it is open.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    uses: statewalker/statewalker-ci/.github/workflows/nightly.yml@main
    with:
      setup: pnpm --filter @statewalker/httpeers-stack exec playwright install --with-deps chromium
