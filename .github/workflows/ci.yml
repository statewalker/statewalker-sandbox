name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:check
      - run: pnpm run format:check
      # httpeers-lib-protos links to packages in the sibling webrun-wire repository
      # (`link:../../../webrun-wire/...`). They exist only in an umbrella assembly,
      # so this package cannot be type-checked or tested from a standalone checkout.
      - run: pnpm -r --filter '!@statewalker/httpeers-lib-protos' run typecheck
      - run: pnpm run build
      - run: pnpm -r --filter '!@statewalker/httpeers-lib-protos' run test
