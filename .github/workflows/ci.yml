name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser suites (vitest browser mode in fm-protos and mvc-blueprint-*,
      # httpeers-stack's two-browser e2e) launch real browsers through the one
      # Playwright version in the lockfile. A fresh runner has none installed.
      - run: pnpm --filter @statewalker/httpeers-stack exec playwright install --with-deps chromium firefox
      - run: pnpm run lint:check
      - run: pnpm run format:check
      # Some checks need the umbrella repository around this one, so a
      # standalone checkout like this runner's cannot run them:
      # - httpeers-lib-protos links to packages in the sibling webrun-wire
      #   repository (`link:../../../webrun-wire/...`);
      # - httpeers-conformance's coverage and parse-ids tests compare the suite
      #   with the specification in the umbrella's docs/ (HTTPEERS_SPEC).
      # Its other tests still run below.
      - run: pnpm -r --filter '!@statewalker/httpeers-lib-protos' run typecheck
      - run: pnpm run build
      - run: >-
          pnpm -r --filter '!@statewalker/httpeers-lib-protos'
          --filter '!@statewalker/httpeers-conformance' run test
      - run: >-
          pnpm --filter @statewalker/httpeers-conformance exec vitest run
          --exclude tests/coverage.test.ts --exclude tests/parse-ids.test.ts
