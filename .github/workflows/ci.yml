name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # apps/vcs-protos/28-gitea runs Gitea (a pinned release, SHA-256 checked) as a test oracle
      GITEA_CACHE_DIR: /home/runner/.cache/gitea-1.22.6
      # apps/vcs-protos/37-xet checks Hugging Face's Xet reference xorb (a pinned dataset revision,
      # SHA-256 checked): cached, so huggingface.co is reached only on a cache miss
      XET_REFERENCE_CACHE: /home/runner/.cache/xet-reference
    steps:
      # The secret scan reads the commits of the pull request (or push): it needs their history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The required baseline, the secret scan and the release-path check of the shared CI
      # (statewalker/statewalker-ci, `baseline: app`, `secret-scan`, `release-path`), run as the
      # equivalent steps here: this job keeps the Gitea and Xet caches the shared workflow has no
      # place for, and the shared workflow's dependency-reference check does not pass here yet
      # (several apps declare versions outside the catalog).
      - name: Check scripts
        uses: actions/checkout@v7
        with:
          repository: statewalker/statewalker-ci
          ref: main
          path: .statewalker-ci
      # Out of the repository, so linting never sees them.
      - name: Move the check scripts out of the workspace
        run: mv .statewalker-ci "$RUNNER_TEMP/statewalker-ci"
      # Before the install, so only the repository's own files are scanned.
      - name: Install gitleaks
        run: bash "$RUNNER_TEMP/statewalker-ci/scripts/install-gitleaks.sh"
      - name: Secret scan
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-secrets.mjs"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # yaml for the release-path check: pinned by the lockfile of statewalker/statewalker-ci.
      - name: Install the check tools
        run: pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/statewalker-ci"
      - name: Release path
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-release-path.mjs"
      # Required root scripts (build, typecheck), a typecheck in every package with a
      # tsconfig.json, and every test file compiled by typecheck or typecheck:tests.
      - name: Required scripts and typechecked tests
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-scripts.mjs" app
      - uses: actions/cache@v4
        with:
          path: ${{ env.GITEA_CACHE_DIR }}
          key: gitea-1.22.6-linux-amd64
      - uses: actions/cache@v4
        with:
          path: ${{ env.XET_REFERENCE_CACHE }}
          key: xet-reference-e72f4e05b9c4b96f1c6b2213d93de00ab943585a2f7c049fd127ba72ec1ff413
      # The browser suites run here (vcs-protos' browser project, httpeers-stack's
      # two-browser e2e) launch real browsers through the one Playwright version in
      # the lockfile. A fresh runner has none installed. The other browser suites
      # and tesseract-do's end-to-end runs are in nightly.yml (root test:nightly).
      - run: pnpm --filter @statewalker/httpeers-stack exec playwright install --with-deps chromium firefox
      - run: pnpm run lint:check
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run typecheck:tests
      # Incremental tests (scripts/tested.mjs): only the packages whose inputs (files, locked
      # dependencies, workspace dependencies, .tested/config.json) changed since they last passed
      # here, as recorded in .tested/. `pnpm test` still runs everything.
      # httpeers-conformance's coverage and parse-ids tests compare the suite with the
      # specification in the umbrella's docs/ (HTTPEERS_SPEC), which a standalone checkout like
      # this runner's does not have: .tested/config.json runs its other tests only.
      - name: Tests (changed packages)
        run: node scripts/tested.mjs run --no-bail --record
      - name: Upload the records of the packages that passed
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: tested-records
          path: .tested/
          include-hidden-files: true
          if-no-files-found: ignore

  # The lockfile-only pull request that .github/workflows/statewalker-update.yml opens: merged
  # once every other check on it passes, after checking it changes pnpm-lock.yaml alone
  # (statewalker/statewalker-ci's merge-lockfile.yml; statewalker-root docs/process/merging.md).
  lockfile:
    needs: ci
    # !cancelled(): also after a failed check job, so the pull request gets a comment saying why.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.head_ref == 'deps/statewalker-lockfile' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    uses: statewalker/statewalker-ci/.github/workflows/merge-lockfile.yml@main
    secrets: inherit

  # After a run on a pull request from this repository: record in .tested/ the hashes (of the merge
  # commit CI tested) of the packages that passed, and push them to the pull request's branch. Merging brings them to main, whose run then skips those packages. Only this job
  # writes .tested/ records. Not on the lockfile pull request, which must change pnpm-lock.yaml
  # alone, nor on the version pull request, which changesets rewrites.
  tested-record:
    needs: ci
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref != 'deps/statewalker-lockfile'
      && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # The statewalker-release App's token when this repository has it: GitHub runs CI on what it
      # pushes (it skips everything, the records being no test input), so the new head has checks.
      # GITHUB_TOKEN otherwise: its push starts no run.
      - name: Push token
        id: token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
      # The merge commit the ci job tested.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token || github.token }}
      # The records of the packages that passed, when the ci job uploaded them (also after a failed
      # run, so one red package does not hold back the others). Otherwise, after a green run, every
      # package passed: record the hashes of the tested commit.
      - name: Records of the packages that passed
        id: passed
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tested-records
          path: .tested
      - name: Record the tested hashes
        if: ${{ steps.passed.outcome != 'success' }}
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          [ "$CI_RESULT" = success ] || { echo "ci did not pass and uploaded no records"; exit 0; }
          node scripts/tested.mjs record
      - name: Push the records to the pull request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mv .tested "$RUNNER_TEMP/tested"
          git fetch --depth=1 origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" FETCH_HEAD
          rm -rf .tested && mv "$RUNNER_TEMP/tested" .tested
          git add .tested
          if git diff --cached --quiet; then echo "records up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: record tested packages"
          # A commit pushed to the branch meanwhile wins: its own run records.
          git push origin "HEAD:$HEAD_REF" || echo "::warning::branch moved; records left to the next run"
