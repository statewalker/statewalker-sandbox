name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # apps/vcs-protos/28-gitea runs Gitea (a pinned release, SHA-256 checked) as a test oracle
      GITEA_CACHE_DIR: /home/runner/.cache/gitea-1.22.6
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      # flue-capfs-do links @statewalker/webrun-files-rpc from a webrun-files checkout beside this
      # repository (`link:../../../webrun-files/packages/webrun-files-rpc`) until the package is
      # on npm: clone it there and build the package (and what it builds against) first.
      - name: webrun-files beside this repository
        run: git clone --depth 1 https://github.com/statewalker/webrun-files ../webrun-files
      - name: Build webrun-files-rpc in it
        working-directory: ../webrun-files
        run: |
          pnpm install --frozen-lockfile --filter '@statewalker/webrun-files-rpc...'
          pnpm --filter '@statewalker/webrun-files-rpc...' run build
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ${{ env.GITEA_CACHE_DIR }}
          key: gitea-1.22.6-linux-amd64
      # The browser suites (vitest browser mode in fm-protos and mvc-blueprint-*,
      # httpeers-stack's two-browser e2e) launch real browsers through the one
      # Playwright version in the lockfile. A fresh runner has none installed.
      - run: pnpm --filter @statewalker/httpeers-stack exec playwright install --with-deps chromium firefox
      - run: pnpm run lint:check
      - run: pnpm run format:check
      # Some checks need the umbrella repository around this one, so a
      # standalone checkout like this runner's cannot run them:
      # - httpeers-lib-protos links to packages in the sibling webrun-wire
      #   repository (`link:../../../webrun-wire/...`);
      # - httpeers-conformance's coverage and parse-ids tests compare the suite
      #   with the specification in the umbrella's docs/ (HTTPEERS_SPEC).
      # Its other tests still run below.
      - run: pnpm run build
      - run: pnpm -r --filter '!@statewalker/httpeers-lib-protos' run typecheck
      - run: >-
          pnpm -r --filter '!@statewalker/httpeers-lib-protos'
          --filter '!@statewalker/httpeers-conformance' run test
      - run: >-
          pnpm --filter @statewalker/httpeers-conformance exec vitest run
          --exclude tests/coverage.test.ts --exclude tests/parse-ids.test.ts
