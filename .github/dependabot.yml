# Dependabot version updates: weekly pull requests, checked by CI and merged by hand.
version: 2
updates:
  # Dependencies, pnpm catalogs included. A version that still fits its range only moves the
  # lockfile; one outside it (a major, or a minor below 1.0) rewrites the range.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    ignore:
      # @flue/runtime 2.3.0 imports `Type` from pi-ai, which 1.5.0 no longer exports; drop
      # these once a @flue/runtime release supports pi-ai 1.5 (see pnpm-workspace.yaml).
      - dependency-name: "@earendil-works/pi-ai"
        versions: [">=1.5.0"]
      - dependency-name: "@earendil-works/pi-agent-core"
        versions: [">=1.5.0"]
    groups:
      # Internal packages are normally updated by the local release script right after a
      # release; this group catches whatever it missed.
      statewalker:
        patterns: ["@statewalker/*"]
      external-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@statewalker/*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      actions:
        patterns: ["*"]
